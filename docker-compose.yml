version: '3.8'
services:
  main:
    build: ./main_service
    ports:
      - "5001:8080" # Spring Boot default port is 8080
  like:
    build: ./like_service
    ports:
      - "5002:8000" # FastAPI default port 8000
  hate:
    build: ./hate_service
    ports:
      - "5003:5000" # Python/Flask default port 5000
